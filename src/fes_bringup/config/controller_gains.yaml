controller_manager:
  ros__parameters:

    update_rate: 100

    output_scale: 10.0

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ankle_left_controller:
      type: fes_control/Controller

    ankle_right_controller:
      type: fes_control/Controller

    knee_left_controller:
      type: fes_control/Controller

    knee_right_controller:
      type: fes_control/Controller



ankle_left_controller:
  ros__parameters:
    joint: ankle_left
    kp: 1.80
    ki: 0.233
    kd: 1.252

ankle_right_controller:
  ros__parameters:
    joint: ankle_right
    kp: 1.80
    ki: 0.3375
    kd: 2.4

knee_left_controller:
  ros__parameters:
    joint: knee_left
    kp: 1.20
    ki: 0.043
    kd: 3.015

knee_right_controller:
  ros__parameters:
    joint: knee_right
    kp: 1.20
    ki: 0.043
    kd: 3.015
